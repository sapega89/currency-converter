[flake8]
# Maximum line length
max-line-length = 127

# Exclude patterns
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    .eggs,
    *.egg,
    build,
    dist

# Ignore specific error codes
# E501: line too long (handled by max-line-length)
# E203: whitespace before ':' (conflicts with black)
# W503: line break before binary operator (conflicts with black)
ignore = E203, E501, W503

# Maximum complexity
max-complexity = 10

# Per-file ignores
per-file-ignores =
    __init__.py:F401

[isort]
# Use black-compatible settings
profile = black
line_length = 127
skip = __pycache__, .git, .venv, venv, build, dist, *.egg

[black]
line-length = 127
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | build
  | dist
)/
'''

