[tool.black]
line-length = 127
target-version = ['py37', 'py38', 'py39', 'py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 127
skip = ["__pycache__", ".git", ".venv", "venv", "build", "dist", "*.egg"]

[tool.flake8]
max-line-length = 127
max-complexity = 10
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    ".eggs",
    "*.egg",
    "build",
    "dist"
]
ignore = ["E203", "E501", "W503"]
per-file-ignores = ["__init__.py:F401"]

